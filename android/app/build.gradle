plugins {
    id 'com.android.application'
}

android {
    compileSdk = 36

    defaultConfig {
        applicationId = "io.github.ouaell.picsh"
        minSdk = 31
        targetSdk = 36
        versionCode = 82
        versionName = "0.8.2"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace "io.github.ouaell.picsh"

    // Emulator rung shipping knobs (decision 009, M1-8 release audit): knob assets live in
    // the DEBUG-ONLY source sets app/src/rungGlesDebug/assets + app/src/rungCpuDebug/assets
    // (<flavor><BuildType>): a release variant of any flavor never bundles picsh-knobs.txt
    // (build.yml unzip audit proves presence on rungGles debug, absence on both releases).
    androidResources {
        noCompress 'txt'
    }

    flavorDimensions 'rung'
    productFlavors {
        // default ladder rung: no knobs file (wgpu auto backend)
        rungDefault { dimension 'rung' }
        // forced GLES backend
        rungGles {
            dimension 'rung'
            applicationIdSuffix '.gles'
        }
        // forced CPU canvas
        rungCpu {
            dimension 'rung'
            applicationIdSuffix '.cpu'
        }
    }
}

dependencies {
    // GameActivity runtime (Java classes only: the Rust android-activity crate owns the
    // native side, so Prefab is not needed). No separate game-text-input: it's integrated.
    implementation "androidx.games:games-activity:4.4.0"
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
