plugins {
    id 'com.android.application'
}

// BR-6: versionCode derived from versionName (versionCode = major*10000 +
// minor*100 + patch) so version bumps are monotonic and traceable.
def versionNameStr = "0.8.2"
def versionParts = versionNameStr.split("\\.")
def versionCodeValue = (versionParts[0] as int) * 10000 + (versionParts[1] as int) * 100 + (versionParts[2] as int)

android {
    compileSdk = 36

    defaultConfig {
        applicationId = "io.github.ouaell.picsh"
        minSdk = 31
        targetSdk = 36
        versionName = versionNameStr
        versionCode = versionCodeValue
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace "io.github.ouaell.picsh"

    // Emulator rung shipping knobs (decision 009, M1-8 release audit): knob assets live in
    // the DEBUG-ONLY source sets app/src/rungGlesDebug/assets + app/src/rungCpuDebug/assets
    // + app/src/rungCrashDebug/assets (<flavor><BuildType> camel naming): a release variant
    // of any flavor never bundles picsh-knobs.txt (build.yml unzip audit proves presence on
    // rungGles + rungCrash debug, absence on all assembled releases).
    androidResources {
        noCompress 'txt'
    }

    flavorDimensions 'rung'
    productFlavors {
        // default ladder rung: no knobs file (wgpu auto backend)
        rungDefault { dimension 'rung' }
        // forced GLES backend
        rungGles {
            dimension 'rung'
            applicationIdSuffix '.gles'
        }
        // forced CPU canvas
        rungCpu {
            dimension 'rung'
            applicationIdSuffix '.cpu'
        }
        // forced one-shot crash after startup: the Back/crash re-entry CI
        // scenario (decision 011 amendment 3) rides this debug-only flavor
        rungCrash {
            dimension 'rung'
            applicationIdSuffix '.crash'
        }
    }
}

dependencies {
    // GameActivity runtime (Java classes only: the Rust android-activity crate owns the
    // native side, so Prefab is not needed). No separate game-text-input: it's integrated.
    implementation "androidx.games:games-activity:4.4.0"
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
