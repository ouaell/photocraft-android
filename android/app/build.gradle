plugins {
    id 'com.android.application'
}

android {
    compileSdk = 35

    defaultConfig {
        applicationId = "io.github.ouaell.picsh"
        minSdk = 31
        targetSdk = 35
        versionCode = 82
        versionName = "0.8.2"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace "io.github.ouaell.picsh"
}

dependencies {
    // GameActivity runtime (Java classes only: the Rust android-activity crate owns the
    // native side, so Prefab is not needed). No separate game-text-input: it's integrated.
    implementation "androidx.games:games-activity:4.4.0"
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
