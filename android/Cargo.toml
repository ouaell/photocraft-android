# Picsh shell — SEPARATE Cargo workspace consuming the pinned upstream crates by path
# (PLAN §3; AGENTS R1/R18). Profiles are NOT inherited across workspaces, so
# [profile.release] below repeats upstream's exactly (BR-3).

[workspace]
# single-package workspace: the shell only; no other member may be added (R18)

[package]
name = "picsh"
version = "0.8.2"                                   # = upstream's version at the pin (BR-6)
edition = "2024"
license = "LicenseRef-PolyForm-Noncommercial"
description = "Picsh: PhotoCraft on Android - platform shell only, no app logic"

[lib]
crate-type = ["cdylib"]

# Unsafe is allowed ONLY in src/jni_bridge.rs / src/ime.rs with an invariant comment (BR-5),
# so upstream's `unsafe_code = "forbid"` floor is intentionally NOT copied here.
[dependencies]
photocraft-engine = { path = "../upstream/crates/engine" }
photocraft-codecs = { path = "../upstream/crates/codecs", features = ["heif"] }  # BR-1
photocraft-ui-egui = { path = "../upstream/crates/ui-egui" }
photocraft-io = { path = "../upstream/crates/io" }
photocraft-format = { path = "../upstream/crates/format" }
photocraft-doc = { path = "../upstream/crates/doc" }
photocraft-raster = { path = "../upstream/crates/raster" }
eframe = { version = "0.36", default-features = false, features = [
    "android-game-activity",
    "wgpu",
    "accesskit",
    "persistence",
] }
egui = { version = "0.36", default-features = false }
log = "0.4"
# logcat sink for the log facade (PORT-SPEC SU-1, shell-only; vetting in
# docs/decisions/005-android-logger-and-winit.md). default = ["regex"] is
# disabled: regex filter matching is not used by the shell
android_logger = { version = "0.15.1", default-features = false }
# direct dep only to name winit's android activity type in the entry point
# (eframe does not re-export winit); resolution stays on the locked 0.30.13
winit = { version = "0.30.13", default-features = false }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
